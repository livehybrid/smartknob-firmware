# Starter image for the SmartKnob Dev Kit: no Wi-Fi details or keys inside,
# so the built file can be flashed as-is from https://web.esphome.io.
#   Wi-Fi:      set over USB right after flashing (Improv), or join the
#               "SmartKnob setup" hotspot and use the page that opens.
#   Encryption: none. ESPHome 2026.9.0 crashes in safe mode when the API has
#               an encryption block but no built-in key, so this image has
#               neither; keep it on a trusted network and move to your own
#               build (smartknob-devkit.yaml, with a key) after testing.
# The pages below use placeholder entities. The display stays on for 5
# minutes after activity, to make first tests easier.

substitutions:
  name: smartknob
  friendly_name: SmartKnob
  display_timeout: "300"  # 5 minutes, in seconds (see packages/smartknob-base.yaml)
  weather_entity: "weather.tomorrow_io_home_daily"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0

external_components:
  - source:
      type: local
      path: components

wifi:
  ap:
    ssid: ${friendly_name} setup

captive_portal:

improv_serial:

api:

ota:
  - platform: esphome

packages:
  base: !include packages/smartknob-base.yaml
  settings: !include packages/page-settings.yaml
  bar_light: !include
    file: packages/page-light.yaml
    vars:
      id: bar_light
      entity: light.dimmer_bar
      name: Bar Light
  kitchen_light: !include
    file: packages/page-light.yaml
    vars:
      id: kitchen_light
      entity: light.dimmer_kitchen
      name: Kitchen Light
  wled1_brightness: !include
    file: packages/page-light.yaml
    vars:
      id: wled1_brightness
      entity: light.wledkitchen1
      name: WLED 1 Brightness
  wled1_color: !include
    file: packages/page-light-color.yaml
    vars:
      id: wled1_color
      entity: light.wledkitchen1
      name: WLED 1 Colour
  wled2_brightness: !include
    file: packages/page-light.yaml
    vars:
      id: wled2_brightness
      entity: light.wledkitchen2
      name: WLED 2 Brightness
  wled2_color: !include
    file: packages/page-light-color.yaml
    vars:
      id: wled2_color
      entity: light.wledkitchen2
      name: WLED 2 Colour
  speakers: !include
    file: packages/page-media-volume.yaml
    vars:
      id: speakers
      entity: media_player.diningroom
      name: Dining Room
  multiroom: !include
    file: packages/page-media-group.yaml
    vars:
      id: multiroom
      name: Multi-room
      entity_1: media_player.kitchen_kitchen
      label_1: Kitchen
      entity_2: media_player.bar_bar
      label_2: Bar
      entity_3: media_player.diningroom
      label_3: Dining Room
  small_blind: !include
    file: packages/page-cover.yaml
    vars:
      id: small_blind
      entity: cover.smallblind
      name: Small Blind
  small_blind_tilt: !include
    file: packages/page-cover.yaml
    vars:
      id: small_blind_tilt
      entity: cover.smallblind
      name: Small Blind Tilt
      color: "0x64D2FF"
      attribute: current_tilt_position
      service: cover.set_cover_tilt_position
      data_key: tilt_position
      toggle: "false"
  big_blind: !include
    file: packages/page-cover.yaml
    vars:
      id: big_blind
      entity: cover.bigdoor
      name: Big Blind
  big_blind_tilt: !include
    file: packages/page-cover.yaml
    vars:
      id: big_blind_tilt
      entity: cover.bigdoor
      name: Big Blind Tilt
      color: "0x64D2FF"
      attribute: current_tilt_position
      service: cover.set_cover_tilt_position
      data_key: tilt_position
      toggle: "false"
  coffee_machine: !include
    file: packages/page-switch.yaml
    vars:
      id: coffee_machine
      entity: switch.coffeemachine
      name: Coffee Machine
