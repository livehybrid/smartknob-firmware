# Setup page: raw knob readings for first-time checks. Needs no Home
# Assistant entities. Turn: the number should go up clockwise. Press: the
# ring turns white and "Press strain" shows the signal.

smartknob:
  on_position_change:
    - if:
        condition:
          and:
            - lvgl.page.is_showing: setup_page
            - lambda: return !id(menu_open);
        then:
          - lvgl.label.update:
              id: setup_position
              text:
                format: "%d"
                args: ["(int) x"]
  on_press:
    - lvgl.arc.update:
        id: setup_arc
        indicator:
          arc_color: 0xFFFFFF
  on_release:
    - lvgl.arc.update:
        id: setup_arc
        indicator:
          arc_color: 0x5E5CE6

interval:
  - interval: 250ms
    then:
      - if:
          condition:
            lvgl.page.is_showing: setup_page
          then:
            - lvgl.label.update:
                id: setup_detail
                text: !lambda |-
                  if (!id(knob).is_calibrated())
                    return std::string(id(knob).is_calibrating() ? "calibrating..." : "not calibrated");
                  const float strain = id(knob_strain).state;
                  return std::isnan(strain) ? std::string("") : str_sprintf("strain %.0f", strain);

lvgl:
  pages:
    - id: setup_page
      on_load:
        - if:
            condition:
              lambda: return id(menu_open);
            then:
              - lvgl.image.update:
                  id: menu_display_icon
                  src: menu_setup
              - lvgl.label.update:
                  id: menu_display_name
                  text: "Setup"
            else:
              - smartknob.set_profile:
                  preset: unbounded_detents
                  position: 0
              - lvgl.label.update:
                  id: setup_position
                  text: "0"
      widgets:
        - arc:
            id: setup_arc
            align: CENTER
            width: 232
            height: 232
            start_angle: 0
            end_angle: 360
            min_value: 0
            max_value: 100
            value: 100
            arc_width: 6
            indicator:
              arc_width: 6
              arc_color: 0x5E5CE6
        - label:
            styles: page_title
            align: CENTER
            y: -52
            text: "Setup"
        - label:
            id: setup_position
            styles: page_value
            align: CENTER
            text: "0"
        - label:
            id: setup_detail
            styles: page_detail
            align: CENTER
            y: 50
            text: ""
