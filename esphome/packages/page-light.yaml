# Light page: turn for brightness, press to toggle.
#
# vars:
#   id:     unique page id (letters, digits, underscores)
#   entity: light entity, e.g. light.desk_lamp
#   name:   title shown on the display
#   step:   brightness step in percent, must divide 100 (default 5)
#   color:  accent colour (default amber)
#   icon:   menu icon id (default menu_light; see packages/smartknob-base.yaml)

defaults:
  step: "5"
  color: "0xFFB340"
  icon: "menu_light"

globals:
  - id: ${id}_value # brightness in percent, 0 = off
    type: int
    initial_value: "0"
  - id: ${id}_dirty # changed on the knob, not yet sent
    type: bool
    initial_value: "false"
  - id: ${id}_touched # millis() of the last knob change
    type: uint32_t
    initial_value: "0"

sensor:
  - platform: homeassistant
    id: ${id}_ha_brightness
    entity_id: ${entity}
    attribute: brightness
    internal: true
    on_value:
      - lambda: |-
          // Ignore Home Assistant while the knob is being turned.
          if (millis() - id(${id}_touched) < 1500) return;
          id(${id}_value) = std::isnan(x) ? 0 : (int) lroundf(x * 100.0f / 255.0f);
      - script.execute: ${id}_show

text_sensor:
  - platform: homeassistant
    id: ${id}_ha_state
    entity_id: ${entity}
    internal: true
    on_value:
      - lambda: |-
          if (x != "on" && millis() - id(${id}_touched) >= 1500)
            id(${id}_value) = 0;
      - script.execute: ${id}_show

script:
  - id: ${id}_show
    then:
      - lvgl.arc.update:
          id: ${id}_arc
          value: !lambda return id(${id}_value);
      - lvgl.label.update:
          id: ${id}_label
          text: !lambda |-
            if (id(${id}_ha_state).state == "unavailable") return std::string("--");
            return id(${id}_value) > 0 ? str_sprintf("%d%%", id(${id}_value)) : std::string("Off");
      - if:
          condition:
            lvgl.page.is_showing: ${id}_page
          then:
            - script.execute:
                id: led_ring_show_value
                percent: !lambda return id(${id}_value) / 100.0f;
                color: ${color}
      - if:
          condition:
            and:
              - lvgl.page.is_showing: ${id}_page
              - lambda: return millis() - id(${id}_touched) >= 1500;
          then:
            - smartknob.set_position: !lambda return (id(${id}_value) + ${step} / 2) / ${step};

smartknob:
  on_position_change:
    - if:
        condition:
          and:
            - lvgl.page.is_showing: ${id}_page
            - lambda: return !id(menu_open);
        then:
          - lambda: |-
              id(${id}_value) = x * ${step};
              id(${id}_dirty) = true;
              id(${id}_touched) = millis();
          - script.execute: ${id}_show
  on_short_press:
    - if:
        condition:
          and:
            - lvgl.page.is_showing: ${id}_page
            - lambda: return !id(menu_open);
        then:
          - homeassistant.action:
              action: light.toggle
              data:
                entity_id: ${entity}

interval:
  # At most four updates a second while turning; the last value always goes out.
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: return id(${id}_dirty);
          then:
            - lambda: id(${id}_dirty) = false;
            - if:
                condition:
                  lambda: return id(${id}_value) > 0;
                then:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: ${entity}
                        brightness_pct: !lambda return id(${id}_value);
                else:
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: ${entity}

lvgl:
  pages:
    - id: ${id}_page
      on_load:
        # Also fires while browsing the page menu (each page-next/previous
        # is a real screen load); show this page's menu entry instead of
        # touching the real haptic profile in that case.
        - if:
            condition:
              lambda: return id(menu_open);
            then:
              - lvgl.image.update:
                  id: menu_display_icon
                  src: ${icon}
              - lvgl.label.update:
                  id: menu_display_name
                  text: "${name}"
            else:
              - smartknob.set_profile:
                  min_position: 0
                  max_position: !lambda return 100 / ${step};
                  position_width: 7
                  detent_strength: 1.0
                  endstop_strength: 1.0
                  position: !lambda return (id(${id}_value) + ${step} / 2) / ${step};
              - script.execute: ${id}_show
      widgets:
        - arc:
            id: ${id}_arc
            align: CENTER
            width: 232
            height: 232
            min_value: 0
            max_value: 100
            value: 0
            arc_width: 14
            arc_color: 0x262626
            indicator:
              arc_width: 14
              arc_color: ${color}
        - label:
            id: ${id}_label
            styles: page_value
            align: CENTER
            text: "--"
        - label:
            styles: page_title
            align: CENTER
            y: 50
            text: "${name}"
