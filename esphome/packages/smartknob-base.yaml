# SeedLabs SmartKnob Dev Kit: hardware, haptics, display, sensors.
#
# Include this first, then one package per page (see ../smartknob-devkit.yaml).
# Pages come in the order their packages are listed. On the knob:
#   turn         change the value on the current page
#   short press  the page's action (toggle, play/pause...)
#   long press   next page
#
# Pin map from the SeedLabs firmware (platformio.ini, env seedlabs_devkit).

substitutions:
  display_timeout: "30"  # seconds; seeds the "Active timeout" number below, tune live in Home Assistant after that
  accent_color: "0xFF9F0A"
  weather_entity: "weather.home"  # override in your device YAML if this isn't yours

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG

# ------------------------------------------------------------------ haptics --

smartknob:
  id: knob
  motor:
    uh_pin: GPIO8
    ul_pin: GPIO16
    vh_pin: GPIO18
    vl_pin: GPIO7
    wh_pin: GPIO17
    wl_pin: GPIO15
    supply_voltage: 5V
  encoder:
    clk_pin: GPIO13
    data_pin: GPIO14
    cs_pin: GPIO11
    spi_host: spi3
  strain_gauge:
    dout_pin: GPIO21
    clk_pin: GPIO1
    press_threshold: 30000
    release_threshold: 15000
    # Pressing down on this unit disturbs the encoder enough to read as a
    # fast spin (confirmed: disabling this gate made every press register).
    # Raised well above normal turning speed so a real press isn't caught
    # by the fast-spin lockout, while still catching genuine fast spins.
    max_velocity: 40
  initial_profile:
    preset: unbounded_detents
  on_position_change:
    - script.execute: wake_display
    # While the menu is open, rotation browses pages instead of changing
    # whatever page happens to be underneath (each page's own
    # on_position_change is itself guarded to ignore this).
    - if:
        condition:
          lambda: return id(menu_open);
        then:
          - if:
              condition:
                lambda: return x > id(menu_last_position);
              then:
                - lvgl.page.next:
                    time: 0ms
              else:
                - lvgl.page.previous:
                    time: 0ms
          - lambda: id(menu_last_position) = x;
  on_press:
    - script.execute: wake_display
    - if:
        condition:
          lambda: return id(notify_active);
        then:
          - script.execute: dismiss_notify
  on_short_press:
    - if:
        condition:
          lambda: return id(notify_active);
        then:
          # Dismiss only: the notification consumes this press, the page
          # underneath doesn't also react to it (see notify_active in every
          # page's on_position_change/on_short_press guard).
          - script.execute: dismiss_notify
        else:
          - if:
              condition:
                lambda: return id(menu_open);
              then:
                # Confirm: close the menu on the page just browsed to. A
                # next-then-previous bounce re-fires that page's own on_load,
                # which restores its real haptic profile (the menu's is generic).
                - lambda: id(menu_open) = false;
                - lvgl.widget.hide: menu_overlay
                - lvgl.page.next:
                    time: 0ms
                - lvgl.page.previous:
                    time: 0ms
                - smartknob.click:
                    strength: 1.5
                    duration: 8ms
              else:
                - homeassistant.event:
                    event: esphome.smartknob
                    data:
                      type: short_press
  on_long_press:
    - smartknob.click:
        strength: 2.0
        duration: 10ms
    - lvgl.page.next:
    - homeassistant.event:
        event: esphome.smartknob
        data:
          type: long_press
  on_menu_press:
    # Held straight through on_long_press's page-next: harmless, the menu
    # overlay covers it immediately, and browsing starts from wherever that
    # landed.
    - lambda: |-
        id(menu_open) = true;
        id(menu_last_position) = 0;
    - lvgl.widget.show: menu_overlay
    - smartknob.click:
        strength: 2.5
        duration: 15ms
    - smartknob.set_profile:
        preset: unbounded_detents
        position: 0
  on_calibration:
    - logger.log:
        level: INFO
        format: "Motor calibration %s"
        args: ['success ? "succeeded" : "FAILED"']

sensor:
  - platform: smartknob
    position:
      name: Position
    strain:
      id: knob_strain
      name: Press strain
    loop_time:
      name: Control loop max time
      disabled_by_default: true

  - platform: vl53l0x
    id: proximity
    name: Proximity
    address: 0x29
    update_interval: 500ms
    long_range: false
    entity_category: diagnostic
    on_value:
      - if:
          condition:
            lambda: |-
              return !std::isnan(x) && x < id(approach_distance).state && id(wake_on_approach).state;
          then:
            - script.execute: wake_display

  - platform: veml7700
    # Faces the back of the knob, so it reads the room behind it.
    ambient_light:
      id: ambient_light
      name: Ambient light
      entity_category: diagnostic
      on_value:
        - script.execute: apply_auto_brightness
    update_interval: 30s

  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
    entity_category: diagnostic

  - platform: homeassistant
    id: weather_temperature
    name: Weather temperature
    internal: false  # homeassistant.sensor defaults internal: true regardless of name:
    entity_id: ${weather_entity}
    attribute: temperature
    entity_category: diagnostic
    on_value:
      - script.execute: update_screensaver

binary_sensor:
  - platform: smartknob
    pressed:
      id: knob_pressed
      name: Pressed

  - platform: template
    name: Presence
    device_class: occupancy
    lambda: |-
      return !std::isnan(id(proximity).state) && id(proximity).state < id(approach_distance).state;
    filters:
      - delayed_off: 2s

text_sensor:
  # ESPHome version, a hash of this exact compiled config, and the build
  # timestamp -- changes on every build, so it's a reliable way to confirm
  # an OTA update actually landed rather than something to remember to bump.
  - platform: version
    name: Firmware version

  - platform: homeassistant
    id: weather_condition
    name: Weather condition
    internal: false
    entity_id: ${weather_entity}
    entity_category: diagnostic
    on_value:
      - script.execute: update_screensaver

i2c:
  sda: GPIO39
  scl: GPIO38
  frequency: 400kHz

number:
  # How long the screen stays fully awake after the last turn, press or
  # (if "Wake on approach" is on) hand approaching, before dimming into
  # the screensaver (or, in "Off" mode, going dark as it always did).
  - platform: template
    id: active_timeout
    name: Active timeout
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${display_timeout}
    min_value: 5
    max_value: 600
    step: 5
    unit_of_measurement: s
    mode: box

  # Only used in "Clock then blank" mode: how long the screensaver stays
  # up before the display goes fully dark.
  - platform: template
    id: screensaver_blank_delay
    name: Screensaver blank delay
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 300
    min_value: 10
    max_value: 3600
    step: 10
    unit_of_measurement: s
    mode: box

  - platform: template
    id: screensaver_brightness
    name: Screensaver brightness
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 45
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: box

  # How long an alert (see the notify service) stays on screen before it's
  # automatically dismissed.
  - platform: template
    id: notify_duration
    name: Notification duration
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 8
    min_value: 3
    max_value: 60
    step: 1
    unit_of_measurement: s
    mode: box

  # How close (metres) counts as "approaching", for both the Presence
  # sensor and (if enabled) waking the display.
  - platform: template
    id: approach_distance
    name: Approach distance
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 0.15
    min_value: 0.05
    max_value: 1.0
    step: 0.01
    unit_of_measurement: m
    mode: box

  # How long to hold before it counts as a long press (next page) rather
  # than a short press (the page's own action). Shorter feels snappier for
  # paging through; too short risks a quick press registering as long.
  - platform: template
    id: long_press_time
    name: Long press time
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 350
    min_value: 150
    max_value: 1500
    step: 25
    unit_of_measurement: ms
    mode: box
    on_value:
      - smartknob.set_long_press_time: !lambda return (uint32_t) x;

  # Press detection thresholds, in raw strain counts from the idle baseline.
  # Watch "Press strain" while pressing to tune these.
  - platform: template
    id: press_threshold
    name: Press threshold
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 30000
    min_value: 1000
    max_value: 500000
    step: 500
    mode: box
    on_value:
      - smartknob.set_press_thresholds:
          press: !lambda return x;
  - platform: template
    id: release_threshold
    name: Release threshold
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 15000
    min_value: 500
    max_value: 500000
    step: 500
    mode: box
    on_value:
      - smartknob.set_press_thresholds:
          release: !lambda return x;

select:
  - platform: template
    id: screensaver_mode
    name: Screensaver
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "Off"
      - "Dim clock"
      - "Clock then blank"
    initial_option: "Dim clock"

button:
  - platform: template
    name: Calibrate motor
    entity_category: config
    on_press:
      - smartknob.calibrate:
  - platform: restart
    name: Restart
    entity_category: diagnostic
  # Page navigation without the press sensor (useful before it is tuned).
  - platform: template
    name: Next page
    entity_category: config
    on_press:
      - lvgl.page.next:

switch:
  - platform: template
    id: haptics
    name: Haptics
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - smartknob.set_haptics: true
    turn_off_action:
      - smartknob.set_haptics: false

  - platform: template
    id: auto_brightness
    name: Auto brightness
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: wake_on_approach
    name: Wake on approach
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

time:
  - platform: homeassistant
    id: ha_time
    # No timezone: set, so it is pulled from Home Assistant along with the time.
    on_time:
      - seconds: 0
        then:
          - script.execute: update_screensaver

globals:
  - id: screensaver_active
    type: bool
    initial_value: "false"
  - id: notify_active
    type: bool
    initial_value: "false"
  - id: menu_open
    type: bool
    initial_value: "false"
  - id: menu_last_position
    type: int32_t
    initial_value: "0"

# ------------------------------------------------------------------ display --

# Weather (screensaver) and page (menu) icons: white line-art on a
# transparent background, generated by tools/gen_icons.py -- see that
# script rather than editing the PNGs by hand.
image:
  defaults:
    type: RGB565
    transparency: alpha_channel
  images:
    - id: wx_sunny
      file: images/wx_sunny.png
    - id: wx_clear_night
      file: images/wx_clear_night.png
    - id: wx_cloudy
      file: images/wx_cloudy.png
    - id: wx_partlycloudy
      file: images/wx_partlycloudy.png
    - id: wx_rainy
      file: images/wx_rainy.png
    - id: wx_snowy
      file: images/wx_snowy.png
    - id: wx_fog
      file: images/wx_fog.png
    - id: wx_lightning
      file: images/wx_lightning.png
    - id: wx_windy
      file: images/wx_windy.png
    - id: menu_light
      file: images/menu_light.png
    - id: menu_media
      file: images/menu_media.png
    - id: menu_climate
      file: images/menu_climate.png
    - id: menu_cover
      file: images/menu_cover.png
    - id: menu_switch
      file: images/menu_switch.png
    - id: menu_setup
      file: images/menu_setup.png

spi:
  - id: display_spi
    clk_pin: GPIO4
    mosi_pin: GPIO3
    interface: spi2  # the encoder has SPI3 to itself

display:
  - platform: mipi_spi
    id: round_display
    model: GC9A01A
    spi_id: display_spi
    cs_pin: GPIO9
    dc_pin: GPIO2
    reset_pin: GPIO10
    invert_colors: true
    data_rate: 40MHz
    auto_clear_enabled: false
    update_interval: never

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO5
    frequency: 20kHz

light:
  - platform: monochromatic
    id: backlight
    name: Display backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms
    entity_category: config

  - platform: esp32_rmt_led_strip
    id: led_ring
    name: LED ring
    pin: GPIO12
    num_leds: 72
    chipset: WS2812
    channel_colors: GRB
    restore_mode: ALWAYS_OFF
    effects:
      - addressable_rainbow:
      - addressable_scan:
      - pulse:

script:
  # Applies the ambient-light curve to the backlight; also the "back to
  # full brightness" step when waking from the dimmed screensaver, so it
  # doesn't wait for the next 30 s ambient-light tick to brighten back up.
  - id: apply_auto_brightness
    then:
      - if:
          condition:
            switch.is_on: auto_brightness
          then:
            - light.turn_on:
                id: backlight
                brightness: !lambda |-
                  // The sensor faces backward (away from the room), so it
                  // reads well below the room's actual light level. Floor
                  // 25%, full brightness by ~60 lx on the sensor.
                  return clamp(0.25f + id(ambient_light).state / 80.0f, 0.25f, 1.0f);
                transition_length: 2s
          else:
            - light.turn_on:
                id: backlight
                transition_length: 250ms

  # Active -> (Screensaver ->) Off, gated by the "Screensaver" select.
  #   Off:               active_timeout, then dark, as before.
  #   Dim clock:          active_timeout, then the clock/weather overlay,
  #                        dimmed, indefinitely.
  #   Clock then blank:   as above, then dark after screensaver_blank_delay.
  # Restarts from the top on every call (turn, press, or approach), so any
  # interaction always returns straight to full brightness on whatever page
  # was already showing underneath.
  - id: wake_display
    mode: restart
    then:
      - lambda: id(screensaver_active) = false;
      - lvgl.widget.hide: screensaver_overlay
      - script.execute: apply_auto_brightness
      # Only wake the ring if it's actually asleep: a bare turn_on (no
      # colour) fills the whole strip white, which on every single call
      # (every turn, every proximity ping) was stomping the addressable
      # per-pixel value arc a moment after it was painted.
      - if:
          condition:
            light.is_off: led_ring
          then:
            - light.turn_on:
                id: led_ring
                transition_length: 0s
      - delay: !lambda return (uint32_t) (id(active_timeout).state * 1000.0f);
      - if:
          condition:
            lambda: return id(screensaver_mode).current_option() == "Off";
          then:
            - light.turn_off:
                id: backlight
                transition_length: 1s
            - light.turn_off:
                id: led_ring
                transition_length: 1s
          else:
            - lambda: id(screensaver_active) = true;
            - script.execute: update_screensaver
            - lvgl.widget.show: screensaver_overlay
            - light.turn_off:
                id: led_ring
                transition_length: 1s
            - light.turn_on:
                id: backlight
                brightness: !lambda return id(screensaver_brightness).state / 100.0f;
                transition_length: 2s
            - if:
                condition:
                  lambda: return id(screensaver_mode).current_option() == "Clock then blank";
                then:
                  - delay: !lambda return (uint32_t) (id(screensaver_blank_delay).state * 1000.0f);
                  - lambda: id(screensaver_active) = false;
                  - lvgl.widget.hide: screensaver_overlay
                  - light.turn_off:
                      id: backlight
                      transition_length: 1s

  # Shows an alert over whatever's on screen, forcing the display and LED
  # ring fully awake regardless of the screensaver, until notify_duration
  # elapses or a press dismisses it early (see on_press/on_short_press
  # above, and notify_active in every page's own gesture guards). Called
  # by the "notify" API service exposed to Home Assistant below.
  - id: show_notify
    mode: restart
    parameters:
      title: string
      message: string
    then:
      - lambda: id(notify_active) = true;
      - script.execute: wake_display
      - lvgl.label.update:
          id: notify_title
          text: !lambda return title;
      - lvgl.label.update:
          id: notify_message
          text: !lambda return message;
      - lvgl.widget.show: notify_overlay
      - light.addressable_set:
          id: led_ring
          range_from: 0
          range_to: 71
          red: 100%
          green: 27%
          blue: 23%
      - smartknob.click:
          strength: 2.5
          duration: 15ms
      - delay: 150ms
      - smartknob.click:
          strength: 2.5
          duration: 15ms
      - delay: !lambda return (uint32_t) (id(notify_duration).state * 1000.0f);
      - script.execute: dismiss_notify

  - id: dismiss_notify
    then:
      - lambda: id(notify_active) = false;
      - lvgl.widget.hide: notify_overlay

  # Refreshes the screensaver's clock, date and weather text. Called on
  # every minute, every weather update, and right before the overlay is
  # shown, so it is never stale when it appears.
  - id: update_screensaver
    then:
      - if:
          condition:
            time.has_time: {}
          then:
            - lvgl.label.update:
                id: screensaver_clock
                text: !lambda return id(ha_time).now().strftime("%H:%M");
            - lvgl.label.update:
                id: screensaver_date
                text: !lambda return id(ha_time).now().strftime("%A %d %B");
      - if:
          condition:
            lambda: return !id(weather_condition).state.empty();
          then:
            - lvgl.widget.show: screensaver_weather_icon
            - lvgl.image.update:
                id: screensaver_weather_icon
                src: !lambda |-
                  const std::string &c = id(weather_condition).state;
                  if (c == "sunny") return id(wx_sunny);
                  if (c == "clear-night") return id(wx_clear_night);
                  if (c == "partlycloudy") return id(wx_partlycloudy);
                  if (c == "rainy" || c == "pouring") return id(wx_rainy);
                  if (c == "snowy" || c == "snowy-rainy" || c == "hail") return id(wx_snowy);
                  if (c == "fog") return id(wx_fog);
                  if (c == "lightning" || c == "lightning-rainy") return id(wx_lightning);
                  if (c == "windy" || c == "windy-variant") return id(wx_windy);
                  return id(wx_cloudy);  // cloudy, exceptional, anything else
          else:
            - lvgl.widget.hide: screensaver_weather_icon
      - lvgl.label.update:
          id: screensaver_weather
          text: !lambda |-
            if (std::isnan(id(weather_temperature).state)) return std::string("");
            return str_sprintf("%.0f°", id(weather_temperature).state);

  # Called by each page to show its value as a lit arc on the physical LED
  # ring (0 = LED 0, clockwise), in the page's own accent colour. Assumes
  # led_ring is already on (wake_display turns it on/off with the display).
  - id: led_ring_show_value
    mode: restart
    parameters:
      percent: float  # 0..1
      color: int      # packed 0xRRGGBB
    then:
      # range_to is the last LED INDEX to include (inclusive), not a count:
      # lit_count LEDs means indices 0..lit_count-1, so the two calls below
      # must never pass an out-of-range index or ESPHome silently resets it
      # to 0, which at 100% wiped the whole ring instead of clearing nothing.
      - if:
          condition:
            lambda: return ((int) roundf(clamp(percent, 0.0f, 1.0f) * 72.0f)) > 0;
          then:
            - light.addressable_set:
                id: led_ring
                range_from: 0
                range_to: !lambda return ((int) roundf(clamp(percent, 0.0f, 1.0f) * 72.0f)) - 1;
                red: !lambda return ((color >> 16) & 0xFF) / 255.0f;
                green: !lambda return ((color >> 8) & 0xFF) / 255.0f;
                blue: !lambda return (color & 0xFF) / 255.0f;
      - if:
          condition:
            lambda: return ((int) roundf(clamp(percent, 0.0f, 1.0f) * 72.0f)) < 72;
          then:
            - light.addressable_set:
                id: led_ring
                range_from: !lambda return (int) roundf(clamp(percent, 0.0f, 1.0f) * 72.0f);
                range_to: 71
                red: 0%
                green: 0%
                blue: 0%

lvgl:
  id: ui
  displays: [round_display]
  buffer_size: 100%
  bg_color: 0x000000
  text_color: 0xFFFFFF
  page_wrap: true
  style_definitions:
    - id: page_title
      text_font: montserrat_18
      text_color: 0xA0A0A0
    - id: page_value
      text_font: montserrat_48
    - id: page_detail
      text_font: montserrat_16
      text_color: 0xA0A0A0
  top_layer:
    widgets:
      # Shown while Home Assistant is not connected.
      - label:
          id: offline_label
          align: TOP_MID
          y: 14
          text: "offline"
          text_font: montserrat_14
          text_color: 0xFF453A
      # Screensaver: clock, date, weather. A full-screen opaque background
      # covers whatever page is underneath; hidden by default, shown by
      # wake_display once the active timeout elapses (see the "Screensaver"
      # select entity for Off / Dim clock / Clock then blank).
      - obj:
          id: screensaver_overlay
          hidden: true
          width: 240
          height: 240
          align: CENTER
          radius: 0
          border_width: 0
          bg_color: 0x000000
          bg_opa: COVER
          widgets:
            # Full white, not the muted page_detail grey: this has to read
            # clearly from across a room at a deliberately dim brightness.
            - label:
                id: screensaver_clock
                align: CENTER
                y: -25
                text_font: montserrat_48
                text_color: 0xFFFFFF
                text: "--:--"
            - label:
                id: screensaver_date
                align: CENTER
                y: 15
                text_font: montserrat_18
                text_color: 0xFFFFFF
                text: ""
            # Icon and temperature side by side, as a centred pair.
            - image:
                id: screensaver_weather_icon
                hidden: true
                align: CENTER
                x: -34
                y: 50
                src: wx_cloudy
            - label:
                id: screensaver_weather
                align: CENTER
                x: 18
                y: 46
                text_font: montserrat_18
                text_color: 0xFFFFFF
                text: ""
      # Page menu: one page's icon and name at a time, shown while browsing
      # (hold past menu_press_time, then turn; a short press confirms). Each
      # page fills these in via its own on_load (see e.g. page-light.yaml).
      - obj:
          id: menu_overlay
          hidden: true
          width: 240
          height: 240
          align: CENTER
          radius: 0
          border_width: 0
          bg_color: 0x000000
          bg_opa: COVER
          widgets:
            - image:
                id: menu_display_icon
                align: CENTER
                y: -30
                src: menu_setup
            - label:
                id: menu_display_name
                align: CENTER
                y: 10
                text_font: montserrat_18
                text_color: 0xFFFFFF
                text: ""
            # Split across two short lines and kept off the bottom of the
            # display: on a round panel, one long line at this height runs
            # past the visible circle and gets clipped.
            - label:
                align: CENTER
                y: 42
                text_font: montserrat_14
                text_color: 0xA0A0A0
                text: "turn to browse"
            - label:
                align: CENTER
                y: 62
                text_font: montserrat_14
                text_color: 0xA0A0A0
                text: "press to select"
      # Alert overlay: shown by the "notify" API service below (see
      # show_notify/dismiss_notify). Covers everything, including the
      # screensaver and the menu, until dismissed.
      - obj:
          id: notify_overlay
          hidden: true
          width: 240
          height: 240
          align: CENTER
          radius: 0
          border_width: 0
          bg_color: 0xFF453A
          bg_opa: COVER
          widgets:
            - label:
                id: notify_title
                align: CENTER
                y: -30
                width: 180
                long_mode: WRAP
                text_align: CENTER
                text_font: montserrat_18
                text_color: 0xFFFFFF
                text: ""
            - label:
                id: notify_message
                align: CENTER
                y: 10
                width: 180
                long_mode: WRAP
                text_align: CENTER
                text_font: montserrat_14
                text_color: 0xFFFFFF
                text: ""
            - label:
                align: CENTER
                y: 62
                text_font: montserrat_14
                text_color: 0xFFFFFF
                text: "press to dismiss"

api:
  on_client_connected:
    - lvgl.widget.hide: offline_label
  on_client_disconnected:
    - if:
        condition:
          not:
            api.connected:
        then:
          - lvgl.widget.show: offline_label
  services:
    # Calling esphome.<device>_notify from Home Assistant shows title and
    # message as a full-screen alert until notify_duration elapses or the
    # knob is pressed, overriding the screensaver and whatever page is up.
    - service: notify
      variables:
        title: string
        message: string
      then:
        - script.execute:
            id: show_notify
            title: !lambda return title;
            message: !lambda return message;
